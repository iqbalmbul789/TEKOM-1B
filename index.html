<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Kelas TEKOM B</title>
  <style>
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Segoe UI',Arial,sans-serif; background:#f5f7fa; color:#333; }

    header { text-align:center; padding:20px; background:#0d47a1; color:white; }
    header h1 { margin-bottom:10px; }

    nav { display:flex; justify-content:center; gap:15px; background:#1565c0; padding:10px; }
    nav button {
      background:#fff; border:none; padding:10px 15px; border-radius:5px;
      cursor:pointer; transition:0.3s;
    }
    nav button:hover { background:#90caf9; }

    .container { max-width:900px; margin:20px auto; padding:15px; }
    .card {
      background:#fff; padding:20px; margin-bottom:20px;
      border-radius:10px; box-shadow:0 4px 6px rgba(0,0,0,0.1);
    }
    .card h3 { margin-bottom:10px; border-bottom:2px solid #eee; padding-bottom:5px; }
    ul { list-style:none; padding:0; }
    li { padding:8px; border-bottom:1px solid #eee; }
    li:last-child { border:none; }

    .social-links { display:flex; gap:15px; justify-content:center; margin-top:20px; }
    .social-links a {
      text-decoration:none; padding:10px 20px; border-radius:8px;
      color:white; font-weight:bold; transition:0.3s;
    }
    .whatsapp { background:#25D366; }
    .whatsapp:hover { background:#1ebe5d; }
    .instagram { background:linear-gradient(45deg,#f58529,#dd2a7b,#8134af,#515bd4); }
    .instagram:hover { opacity:0.85; }

    .hidden { display:none; }
    .add-btn {
      margin-top:10px; padding:8px 12px; border:none; border-radius:5px;
      background:#0d47a1; color:white; cursor:pointer;
    }
    .add-btn:hover { background:#1565c0; }
    input { padding:6px; margin-top:10px; width:70%; }
  </style>
</head>
<body>
  <header>
    <h1>Kelas TEKOM B</h1>
    <p>Portal Informasi Mahasiswa</p>
  </header>

  <nav>
    <button onclick="tampil('siswa')">👩‍🎓 Daftar Siswa</button>
    <button onclick="tampil('aktivitas')">📝 Aktivitas</button>
    <button onclick="tampil('pengumuman')">📢 Pengumuman</button>
  </nav>

  <div class="container">
    <!-- Daftar Siswa -->
    <div id="siswa" class="card">
      <h3>👩‍🎓 Daftar Siswa</h3>
      <ul id="listSiswa"></ul>
    </div>

    <!-- Aktivitas -->
    <div id="aktivitas" class="card hidden">
      <h3>📝 Aktivitas</h3>
      <ul id="listAktivitas"></ul>
      <div>
        <input type="text" id="inputAktivitas" placeholder="Tambah aktivitas baru" />
        <button class="add-btn" onclick="tambahAktivitas()">Tambah</button>
      </div>
    </div>

    <!-- Pengumuman -->
    <div id="pengumuman" class="card hidden">
      <h3>📢 Pengumuman</h3>
      <ul id="listPengumuman"></ul>
      <div>
        <input type="text" id="inputPengumuman" placeholder="Tambah pengumuman baru" />
        <button class="add-btn" onclick="tambahPengumuman()">Tambah</button>
      </div>
    </div>

    <!-- Sosial Media -->
    <div class="card">
      <h3>🌐 Sosial Media</h3>
      <div class="social-links">
        <a class="whatsapp" href="https://wa.me/6281234567890" target="_blank">WhatsApp</a>
        <a class="instagram" href="https://instagram.com/tekom_b" target="_blank">Instagram</a>
      </div>
    </div>
  </div>

  <script>
    // Daftar siswa lengkap
    let siswa=JSON.parse(localStorage.getItem("siswa"))||[
      "Siti Olyvia - Teknik Komputer",

      "Muhammad Enggar Ilman Nafian - Teknik Komputer",
      "Vico Algibran - Teknik Komputer",
      "Arief Ahmadi - Teknik Komputer",
      "Widya Ayu Gistala - Teknik Komputer",
      "Muhammad Aeris Angghi Effendi - Teknik Komputer",
      "Sudarman - Teknik Komputer",
      "Fauzan Aziz - Teknik Komputer",
      "Eza Julian - Teknik Komputer",
      "Krisda Apriantika - Teknik Komputer",
      "Dwi Ramadhanna - Teknik Komputer",
      "Repy Septiyawan - Teknik Komputer",
      "Khutrotul Jannah - Teknik Komputer",
      "Aisyiyah Qolbi - Teknik Komputer",
      "Bakas Minanga Jaya Laga - Teknik Komputer",
      "Anisa Hanifatun Abdilah - Teknik Komputer",
      "Irvan Ali Rosyadi - Teknik Komputer",
      "Muhammad Ghazian Alpha Hazazi - Teknik Komputer",
      "Naufal Halim - Teknik Komputer",

      "Antoni Wijaya - Teknik Komputer",
      "Arief Junaidi - Teknik Komputer",
      "Aulia Malik Fadhillah - Teknik Komputer",
      "Ulfi Maula - Teknik Komputer",
      "Kholillurrohman - Teknik Komputer",
      "Mugi Handoyo - Teknik Komputer"
    ];

    // Aktivitas kelas
    let aktivitas=JSON.parse(localStorage.getItem("aktivitas"))||[
      "Presentasi tugas kelompok",
      "Diskusi kelas",
      "Praktikum di laboratorium",
      "Mengerjakan kuis",
      "Ujian Tengah Semester (UTS)",
      "Ujian Akhir Semester (UAS)",
      "Belajar mandiri di kelas",
      "Rapat kelas bersama dosen wali"
    ];

    // Pengumuman
    let pengumuman=JSON.parse(localStorage.getItem("pengumuman"))||[
      "Minggu libur, besok mau tidur pulas"
    ];

    function simpan() {
      localStorage.setItem("siswa",JSON.stringify(siswa));
      localStorage.setItem("aktivitas",JSON.stringify(aktivitas));
      localStorage.setItem("pengumuman",JSON.stringify(pengumuman));
    }

    function tampil(menu) {
      document.getElementById("siswa").classList.add("hidden");
      document.getElementById("aktivitas").classList.add("hidden");
      document.getElementById("pengumuman").classList.add("hidden");
      document.getElementById(menu).classList.remove("hidden");
      render();
    }

    function render() {
      // siswa
      let sList=document.getElementById("listSiswa");
      sList.innerHTML=""; siswa.forEach(n=>{ let li=document.createElement("li"); li.textContent=n; sList.appendChild(li); });
      // aktivitas
      let aList=document.getElementById("listAktivitas");
      aList.innerHTML=""; aktivitas.forEach(n=>{ let li=document.createElement("li"); li.textContent=n; aList.appendChild(li); });
      // pengumuman
      let pList=document.getElementById("listPengumuman");
      pList.innerHTML=""; pengumuman.forEach(n=>{ let li=document.createElement("li"); li.textContent=n; pList.appendChild(li); });
    }

    function tambahAktivitas() {
      let val=document.getElementById("inputAktivitas").value.trim();
      if(val){ aktivitas.push(val); document.getElementById("inputAktivitas").value=""; simpan(); render(); }
    }
    function tambahPengumuman() {
      let val=document.getElementById("inputPengumuman").value.trim();
      if(val){ pengumuman.push(val); document.getElementById("inputPengumuman").value=""; simpan(); render(); }
    }

    // Tampilkan siswa default saat buka
    render();
  </script>
</body>
</html>
