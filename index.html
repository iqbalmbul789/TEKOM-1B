<!DOCTYPE html>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  color: #333;
  margin: 0;
  padding: 0;
}
header {
  text-align: center;
  padding: 20px;
  background: #1a237e;
  color: white;
}
header img {
  width: 120px;
  height: 120px;
  object-fit: contain;
  margin-bottom: 10px;
}
header h1 {
  margin: 0;
  font-size: 28px;
}
header h2 {
  margin: 5px 0 0;
  font-weight: normal;
  font-size: 18px;
}
nav {
  text-align: center;
  margin: 20px 0;
}
nav button {
  background: #3949ab;
  border: none;
  color: white;
  padding: 10px 18px;
  margin: 5px;
  border-radius: 5px;
  cursor: pointer;
  font-size: 14px;
}
nav button:hover {
  background: #1a237e;
}
.card {
  background: white;
  max-width: 700px;
  margin: 20px auto;
  padding: 20px;
  border-radius: 8px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}
h3 {
  color: #1a237e;
  margin-bottom: 15px;
}
ul {
  list-style: none;
  padding: 0;
}
ul li {
  background: #f0f0f0;
  margin: 5px 0;
  padding: 10px 15px;
  border-radius: 5px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.delete-btn {
  color: red;
  cursor: pointer;
  font-weight: bold;
}
input[type="text"] {
  padding: 8px;
  width: 70%;
  border: 1px solid #ccc;
  border-radius: 5px;
  margin-right: 5px;
}
.add-btn {
  background: #1a237e;
  border: none;
  color: white;
  padding: 8px 14px;
  border-radius: 5px;
  cursor: pointer;
}
.add-btn:hover {
  background: #3949ab;
}
.hidden {
  display: none;
}
#chatOutput {
  height: 200px;
  overflow-y: auto;
  background: #f0f0f0;
  color: #333;
  padding: 10px;
  border-radius: 5px;
  margin-bottom: 10px;
}
</style>
</head>
<body>

<header>
<img src="logo.png" alt="Logo Kelas TEKOM B">
<h1>Kelas TEKOM B</h1>
<h2>Computer Engineering</h2>
<button id="musicControl" onclick="toggleMusic()">🔊 Musik</button>
<audio id="bgMusic" loop>
  <source src="musik.mp3" type="audio/mpeg">
</audio>
</header>

<nav>
<button onclick="show('siswa')">Daftar Siswa</button>
<button onclick="show('jadwal')">Jadwal Kelas</button>
<button onclick="show('aktivitas')">Aktivitas</button>
<button onclick="show('chat')">Chat AI</button>
</nav>

<div id="siswa" class="card">
<h3>Daftar Siswa</h3>
<ul id="listSiswa"></ul>
<div>
<input type="text" id="inputSiswa" placeholder="Masukkan nama siswa" />
<button class="add-btn" onclick="tambahSiswa()">Tambah</button>
</div>
</div>

<div id="jadwal" class="card hidden">
<h3>Jadwal Kelas</h3>
<ul>
<li>Senin: Ilmu Filsafat, Keamanan Informasi, Bahasa Inggris, PAI</li>
<li>Selasa: PKN, Pengantar TI, Sistem Komputer</li>
</ul>
</div>

<div id="aktivitas" class="card hidden">
<h3>Aktivitas Kelas</h3>
<ul id="listAktivitas"></ul>
<div>
<input type="text" id="inputAktivitas" placeholder="Tambah aktivitas baru" />
<button class="add-btn" onclick="tambahAktivitas()">Tambah</button>
</div>
</div>

<div id="chat" class="card hidden">
<h3>Chat AI - Tanya ChatGPT</h3>
<div id="chatOutput"></div>
<input type="text" id="chatInput" placeholder="Tanya sesuatu..." />
<button class="add-btn" onclick="kirimChat()">Kirim</button>
</div>

function renderList(arr,id,removeFn){
  const list=document.getElementById(id);
  list.innerHTML='';
  arr.forEach((item,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`${item} <span class="delete-btn" onclick="${removeFn}(${i}, this)">❌</span>`;
    list.appendChild(li);
  });
}
function renderSiswa(){renderList(siswa,'listSiswa','hapusSiswa');}
function renderAktivitas(){renderList(aktivitas,'listAktivitas','hapusAktivitas');}

function tambahSiswa(){let n=document.getElementById('inputSiswa').value.trim(); if(!n){alert('Nama siswa tidak boleh kosong'); return;} siswa.push(n); simpanData(); renderSiswa(); document.getElementById('inputSiswa').value='';}
function tambahAktivitas(){let a=document.getElementById('inputAktivitas').value.trim(); if(!a){alert('Aktivitas tidak boleh kosong'); return;} aktivitas.push(a); simpanData(); renderAktivitas(); document.getElementById('inputAktivitas').value='';}

function hapusSiswa(i,el){siswa.splice(i,1); simpanData(); renderSiswa();}
function hapusAktivitas(i,el){aktivitas.splice(i,1); simpanData(); renderAktivitas();}

function simpanData(){localStorage.setItem("siswa",JSON.stringify(siswa)); localStorage.setItem("aktivitas",JSON.stringify(aktivitas));}

renderSiswa(); renderAktivitas();

// ChatGPT
async function kirimChat(){
  const input=document.getElementById('chatInput').value.trim();
  if(!input){alert('Masukkan pertanyaan!');return;}
  const output=document.getElementById('chatOutput');
  output.innerHTML+=`<p><strong>Anda:</strong> ${input}</p>`;
  output.scrollTop=output.scrollHeight;
  try{
    const res=await fetch('http://localhost:3000/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({prompt: input})
    });
    const data=await res.json();
    output.innerHTML+=`<p><strong>ChatGPT:</strong> ${data.reply}</p>`;
    output.scrollTop=output.scrollHeight;
    document.getElementById('chatInput').value='';
  }catch(err){
    output.innerHTML+=`<p style="color:red;"><strong>Error:</strong> ${err}</p>`;
  }
}
</script>
