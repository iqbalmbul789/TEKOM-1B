<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Kelas TEKOM B - Computer Engineering</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet" />
  <!-- Font Awesome untuk ikon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    /* Reset dan font */
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #e3f2fd, #bbdefb);
      margin: 0;
      padding: 0;
      color: #333;
    }

    /* Header */
    header {
      text-align: center;
      padding: 30px 20px;
      background: #0d47a1;
      color: white;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      position: relative;
      overflow: hidden;
    }

    header::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('https://www.transparenttextures.com/patterns/cubes.png');
      opacity: 0.1;
      z-index: 0;
    }

    header img {
      width: 120px;
      height: 120px;
      object-fit: contain;
      margin-bottom: 10px;
      border-radius: 50%;
      background-color: white;
      padding: 5px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
      position: relative;
      z-index: 1;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 700;
      position: relative;
      z-index: 1;
    }

    header h2 {
      margin: 5px 0 0;
      font-weight: 400;
      font-size: 18px;
      opacity: 0.9;
      position: relative;
      z-index: 1;
    }

    /* Navigasi */
    nav {
      text-align: center;
      margin: 20px 0;
      background-color: #f8f9fa;
      padding: 10px 0;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      border-radius: 8px;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }

    nav button {
      background: #1976d2;
      border: none;
      color: white;
      padding: 12px 20px;
      margin: 5px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 15px;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    nav button:hover {
      background: #0d47a1;
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    nav button.active {
      background: #0d47a1;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    /* Kartu konten */
    .card {
      background: white;
      max-width: 600px;
      margin: 20px auto;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
      animation: fadeIn 0.6s ease-out;
    }

    h3 {
      color: #0d47a1;
      margin-top: 0;
      font-size: 24px;
      border-bottom: 2px solid #e3f2fd;
      padding-bottom: 10px;
      margin-bottom: 20px;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    ul li {
      background: #f5f5f5;
      margin: 8px 0;
      padding: 10px 15px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background-color 0.2s, transform 0.2s;
      font-size: 16px;
    }

    ul li:hover {
      background: #e3f2fd;
      transform: translateX(5px);
    }

    .delete-btn {
      color: #dc3545;
      cursor: pointer;
      font-weight: bold;
      font-size: 18px;
      transition: color 0.2s;
    }

    .delete-btn:hover {
      color: #c82333;
    }

    input[type="text"] {
      padding: 10px;
      width: calc(70% - 20px);
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-right: 10px;
      font-size: 16px;
    }

    .add-btn {
      background: #28a745;
      border: none;
      color: white;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s;
      font-size: 16px;
    }

    .add-btn:hover {
      background: #218838;
    }

    .hidden {
      display: none;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  <nav>
    <button onclick="show('siswa')">📘 Daftar Siswa</button>
    <button onclick="show('jadwal')">📅 Jadwal Kelas</button>
    <button onclick="show('aktivitas')">📝 Aktivitas</button>
  </nav>

  <div id="siswa" class="card">
    <h3>Daftar Siswa</h3>
    <ul id="listSiswa"></ul>
    <div>
      <input type="text" id="inputSiswa" placeholder="Masukkan nama siswa" />
      <button class="add-btn" onclick="tambahSiswa()">Tambah</button>
    </div>
  </div>

  <div id="jadwal" class="card hidden">
    <h3>Jadwal Kelas</h3>
    <ul>
      <li>Senin: Ilmu Filsafat (07:30 - 09:00), Keamanan Informasi (09:00 - 10:30), Bahasa Inggris (10:30 - 12:00), PAI (13:00 - 14:30)</li>
      <li>Selasa: PKN (07:30 - 09:00), Pengantar TI (09:00 - 10:30), Sistem Komputer (10:30 - 12:00)</li>
    </ul>
  </div>

  <div id="aktivitas" class="card hidden">
    <h3>Aktivitas Kelas</h3>
    <ul id="listAktivitas"></ul>
    <div>
      <input type="text" id="inputAktivitas" placeholder="Tambah aktivitas baru" />
      <button class="add-btn" onclick="tambahAktivitas()">Tambah</button>
    </div>
  </div>

  <script>

      document.getElementById('siswa').classList.add('hidden');
      document.getElementById('jadwal').classList.add('hidden');
      document.getElementById('aktivitas').classList.add('hidden');
      document.getElementById(id).classList.remove('hidden');
    }

    let aktivitas = JSON.parse(localStorage.getItem("aktivitas")) || [
      "Diskusi kelompok",
      "Presentasi tugas",
      "Praktikum lab"
    ];

    function renderSiswa() {
      let list = document.getElementById('listSiswa');
      list.innerHTML = '';
      siswa.forEach((nama, i) => {
        let li = document.createElement('li');
        li.innerHTML = `${nama} <span class="delete-btn" onclick="hapusSiswa(${i})">❌</span>`;
        list.appendChild(li);
      });
    }

    function renderAktivitas() {
      let list = document.getElementById('listAktivitas');
      list.innerHTML = '';
      aktivitas.forEach((act, i) => {
        let li = document.createElement('li');
        li.innerHTML = `${act} <span class="delete-btn" onclick="hapusAktivitas(${i})">❌</span>`;
        list.appendChild(li);
      });
    }

    function tambahSiswa() {
      let input = document.getElementById('inputSiswa');
      let nama = input.value.trim();
      if (nama === '') { alert('Nama siswa tidak boleh kosong!'); return; }
      siswa.push(nama);
      simpanData();
      renderSiswa();
      input.value = '';
    }

    function tambahAktivitas() {
      let input = document.getElementById('inputAktivitas');
      let act = input.value.trim();
      if (act === '') { alert('Aktivitas tidak boleh kosong!'); return; }
      aktivitas.push(act);
      simpanData();
      renderAktivitas();
      input.value = '';
    }

    function hapusSiswa(i) {
      siswa.splice(i, 1);
      simpanData();
      renderSiswa();
    }
    function hapusAktivitas(i) {
      aktivitas.splice(i, 1);
      simpanData();
      renderAktivitas();
    }

    function simpanData() {
      localStorage.setItem("siswa", JSON.stringify(siswa));
      localStorage.setItem("aktivitas", JSON.stringify(aktivitas));
    }

    renderSiswa();
    renderAktivitas();
  </script>
